# Q-Empire Social Autopilot - Schedule Templates
# Pre-configured posting schedules for autopilot mode

schedules:
  daily_morning:
    name: "Daily Morning Post"
    description: "Post once daily at 9:00 AM UTC"
    frequency: "daily"
    cron: "0 9 * * *"
    posts_per_run: 1
    
  daily_peak:
    name: "Daily Peak Hours"
    description: "Post during peak engagement hours"
    frequency: "daily"
    cron: "0 12 * * *"
    posts_per_run: 1
    
  twice_daily:
    name: "Twice Daily"
    description: "Post at 9 AM and 5 PM UTC"
    frequency: "twice_daily"
    cron: "0 9,17 * * *"
    posts_per_run: 1
    
  three_times_daily:
    name: "Three Times Daily"
    description: "Morning, noon, and evening posts"
    frequency: "custom"
    cron: "0 8,13,18 * * *"
    posts_per_run: 1
    
  weekdays_only:
    name: "Weekdays Only"
    description: "Post Monday through Friday at 10 AM"
    frequency: "custom"
    cron: "0 10 * * 1-5"
    posts_per_run: 1
    
  weekly_monday:
    name: "Weekly Monday"
    description: "Post every Monday at 9 AM"
    frequency: "weekly"
    cron: "0 9 * * 1"
    posts_per_run: 1
    
  aggressive:
    name: "Aggressive Growth"
    description: "Post 4 times daily for maximum reach"
    frequency: "custom"
    cron: "0 7,11,15,20 * * *"
    posts_per_run: 1
    
  weekend_boost:
    name: "Weekend Boost"
    description: "Extra posts on weekends"
    frequency: "custom"
    cron: "0 10,14,18 * * 6,0"
    posts_per_run: 1

# Optimal posting times by platform (UTC)
optimal_times:
  facebook: ["09:00", "13:00", "16:00"]
  instagram: ["11:00", "14:00", "17:00"]
  twitter: ["08:00", "12:00", "17:00"]
  linkedin: ["07:30", "12:00", "17:30"]
  tiktok: ["07:00", "12:00", "19:00"]
  pinterest: ["14:00", "20:00", "21:00"]
  youtube: ["12:00", "15:00", "18:00"]
  reddit: ["06:00", "08:00", "12:00"]
